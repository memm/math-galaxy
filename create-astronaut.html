<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Utwórz kosmonautę</title>
  <link rel="stylesheet" href="/assets/css/emoji-picker.css" />
</head>
<body>
  <main>
    <h1>Utwórz nowego kosmonautę</h1>
    <form id="create-astronaut-form" action="/astronauts/create" method="POST">
      <div class="form-group">
        <label for="astronaut-name">Imię</label>
        <input id="astronaut-name" name="name" type="text" required />
      </div>

      <div class="form-group">
        <label class="emoji-picker-label" for="astronaut-emoji">
          Ikona kosmonauty
          <span class="emoji-preview" id="emoji-preview">🚀</span>
        </label>

        <!-- hidden input to submit chosen emoji -->
        <input type="hidden" id="astronaut-emoji" name="emoji" value="🚀" />

        <!-- emoji grid rendered by JS -->
        <div id="emoji-grid" class="emoji-grid" role="list" aria-label="Wybierz emoji"></div>
      </div>

      <button type="submit">Utwórz</button>
    </form>
  </main>

  <script src="/assets/js/emoji-picker.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      EmojiPicker.init({
        containerSelector: '#emoji-grid',
        inputSelector: '#astronaut-emoji',
        defaultEmoji: document.querySelector('#astronaut-emoji').value || '🚀'
      });

      const preview = document.getElementById('emoji-preview');
      const input = document.getElementById('astronaut-emoji');
      if (input && preview) {
        input.addEventListener('input', () => {
          preview.textContent = input.value || '🚀';
        });
        preview.textContent = input.value || preview.textContent;
      }
    });
  </script>
</body>
</html>
