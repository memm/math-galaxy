        // --- SOUND MANAGER ---
        const SoundManager = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone: function(freq, type, duration, startTime = 0, vol = 0.1) {
                if (!this.ctx) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + startTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + startTime + duration);
                osc.stop(this.ctx.currentTime + startTime + duration);
            },
            playSuccess: function() { this.playTone(600, 'sine', 0.1); this.playTone(900, 'sine', 0.3, 0.1); },
            playError: function() { this.playTone(200, 'sawtooth', 0.2); this.playTone(150, 'sawtooth', 0.4, 0.1); },
            playClick: function() { this.playTone(800, 'triangle', 0.05, 0, 0.05); },
            playLevelUp: function() {

            } catch (e) {

          const [lang, setLang] = useState('pl');

          const t = (key) => TRANSLATIONS[lang][key] || key;

          // Inicjalizacja danych z Dexie
          useEffect(() => {
            const loadUsers = async () => {
              try {
                const allUsers = await db.users.toArray();
                setUsers(allUsers);
              } catch (e) {
                console.error("Błąd wczytywania użytkowników:", e);
              }
            };
            loadUsers();
          }, []);

          const handleCreateUser = async (name, avatar) => {
            const newUser = { 
                id: Date.now(), 
                name, 
                avatar, 
                xp: 0, 
                totalXp: 0, 
                streak: 0, 
                lastPlayed: null, 
                dailyXp: 0, 
                dailyGoalReached: false, 
                history: [], 
                unlockedItems: [], // PUSTA LISTA
                activeBackground: '', 
                activeSkin: '', 
                achievements: [], 
                consecutiveCorrect: 0 
            };
            try {
              const id = await db.users.add(newUser);
              const userWithId = { ...newUser, id };
              setUsers([...users, userWithId]);
              loginUser(userWithId, [...users, userWithId]);
            } catch (e) {
              console.error("Błąd tworzenia użytkownika:", e);
            }
          };
          const handleDeleteUserClick = (userId) => setUserToDelete(userId);
          const confirmDeleteUser = async () => {
            if (userToDelete) {
                try {
                  await db.users.delete(userToDelete);
                  const updatedUsers = users.filter(u => u.id !== userToDelete);
                  setUsers(updatedUsers);
                  if (currentUser?.id === userToDelete) setCurrentUser(null);
                  setUserToDelete(null);
                } catch (e) {
                  console.error("Błąd usuwania użytkownika:", e);
                }
            }
          };
          const loginUser = async (user, currentUsersList = users) => {
            const today = new Date().toDateString();
            let updatedUser = { ...user };
            if (!updatedUser.totalXp) updatedUser.totalXp = updatedUser.xp; // Migracja starych użytkowników

            let needsUpdate = false;

            if (user.lastPlayed !== today) {
               updatedUser.dailyXp = 0;
               updatedUser.dailyGoalReached = false;
               const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
               if (user.lastPlayed && user.lastPlayed !== yesterday.toDateString()) {
                  updatedUser.streak = 0; 
               }
               needsUpdate = true;
            }
            
            if (needsUpdate) {
              try {
                await db.users.update(user.id, updatedUser);
                const updatedList = currentUsersList.map(u => u.id === user.id ? updatedUser : u);
                setUsers(updatedList);
              } catch (e) {
                console.error("Błąd aktualizacji logowania:", e);
              }
            }
            setCurrentUser(updatedUser);
            setView('dashboard');
          };

          const handleBuyItem = async (item) => {
              if (!currentUser) return;
              if (currentUser.xp < item.price) return;

              const updatedUser = { ...currentUser, xp: currentUser.xp - item.price, unlockedItems: [...(currentUser.unlockedItems || []), item.id] };
              
              if (item.type === 'avatar') updatedUser.avatar = item.content;
              if (item.type === 'background') updatedUser.activeBackground = item.content;
              if (item.type === 'skin') updatedUser.activeSkin = item.content;

              try {
                  await db.users.update(currentUser.id, updatedUser);
                  setCurrentUser(updatedUser);
                  setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
                  SoundManager.playBuy();
              } catch (e) { console.error("Błąd zakupu:", e); }
          };

          const handleEquipItem = async (item) => {
              if (!currentUser) return;
              const updatedUser = { ...currentUser };
              if (item.type === 'avatar') updatedUser.avatar = item.content;
              if (item.type === 'background') updatedUser.activeBackground = item.content;
              if (item.type === 'skin') updatedUser.activeSkin = item.content;

              try {
                  await db.users.update(currentUser.id, updatedUser);
                  setCurrentUser(updatedUser);
                  setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
              } catch (e) { console.error("Błąd wyposażania:", e); }
          };

          const checkAchievements = async (user, sessionCorrectTimestamps) => { // DODANO ASYNC
              let newAchievements = [];
              let updatedUser = { ...user };

              // 1. Pierwszy Krok
              if (!user.achievements.includes('first_step')) {
                  newAchievements.push(ACHIEVEMENTS.find(a => a.id === 'first_step'));
                  updatedUser.achievements.push('first_step');
              }

              // 2. Szybki jak kometa (10 w minutę)
              if (!user.achievements.includes('speedster') && sessionCorrectTimestamps.length >= 10) {
                  const last10 = sessionCorrectTimestamps.slice(-10);
                  const timeDiff = last10[last10.length - 1] - last10[0];
                  if (timeDiff <= 60000) { // 60 sekund
                      newAchievements.push(ACHIEVEMENTS.find(a => a.id === 'speedster'));
                      updatedUser.achievements.push('speedster');
                  }
              }

              // 3. Bezbłędny Lot (50 z rzędu)
              if (!user.achievements.includes('flawless') && user.consecutiveCorrect >= 50) {
                  newAchievements.push(ACHIEVEMENTS.find(a => a.id === 'flawless'));
                      updatedUser.achievements.push('flawless');
                  }
              // Błąd w logice IF w poprzedniej wersji, usunięto zagnieżdżenie, aby uniknąć pomyłek.

              // 4. Nocny Marek (po 20:00)
              if (!user.achievements.includes('night_owl') && new Date().getHours() >= 20) {
                  newAchievements.push(ACHIEVEMENTS.find(a => a.id === 'night_owl'));
                  updatedUser.achievements.push('night_owl');
              }

              // 5. Mistrz Liczb (1000 XP)
              if (!user.achievements.includes('math_master') && (user.totalXp || user.xp) >= 1000) {
                  newAchievements.push(ACHIEVEMENTS.find(a => a.id === 'math_master'));
                  updatedUser.achievements.push('math_master');
              }

              if (newAchievements.length > 0) {
                  setJustUnlockedAchievement(newAchievements[0]); // Pokaż tylko pierwszy
                  SoundManager.playAchievement();
                  confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
                  
                  // Zapisz zmiany w bazie
                  try {
                    await db.users.update(user.id, { achievements: updatedUser.achievements });
                    // Zaktualizuj stan lokalny użytkownika
                    setCurrentUser(prev => ({ ...prev, achievements: updatedUser.achievements }));
                    setUsers(prev => prev.map(u => u.id === user.id ? { ...u, achievements: updatedUser.achievements } : u));
                  } catch (e) {
                    console.error("Błąd zapisu osiągnięć:", e);
                  }
              }
          };

          const updateUserProgress = async (xpGained) => {
            if (!currentUser) return;
            const today = new Date().toDateString();
            let updatedUser = { ...currentUser };
            updatedUser.xp += xpGained;
            updatedUser.totalXp = (updatedUser.totalXp || 0) + xpGained; // Total XP zawsze rośnie

            const newDailyXp = (updatedUser.dailyXp || 0) + xpGained;
            updatedUser.dailyXp = Math.max(0, newDailyXp);
            updatedUser.lastPlayed = today;
            if (updatedUser.dailyXp >= DAILY_XP_GOAL && !updatedUser.dailyGoalReached) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                SoundManager.playLevelUp();
                updatedUser.streak += 1;
                updatedUser.dailyGoalReached = true;
            }
            
            try {
               await db.users.update(currentUser.id, updatedUser);
               setCurrentUser(updatedUser);
               setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
            } catch (e) {
               console.error("Błąd aktualizacji postępu:", e);
            }
          };

          const generateQuestion = (mode, difficulty) => {
            const maxVal = DIFFICULTY_LEVELS[difficulty].max;
            let a = 1, b = 1, operator = '+', result = 2, answer = 2;
            let missing = 'result';
            
            let minVal = 1;
            if (difficulty === 'medium') minVal = 10;
            if (difficulty === 'hard') minVal = 100;

            const generateRandom = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            if (mode === 'sequences') {
                let seq = [];
                let step, start, type;
                if (difficulty === 'easy') {
                    type = 'arithmetic';
                    step = generateRandom(1, 5);
                    start = generateRandom(1, 10);
                } else if (difficulty === 'medium') {
                    type = Math.random() > 0.3 ? 'arithmetic' : 'geometric';
                    if (type === 'arithmetic') { step = generateRandom(3, 10); start = generateRandom(5, 30); } 
                    else { step = 2; start = generateRandom(2, 10); }
                } else { 
                    type = Math.random() > 0.5 ? 'arithmetic' : 'geometric';
                    if (type === 'arithmetic') { step = generateRandom(7, 25); start = generateRandom(20, 100); } 
                    else { step = generateRandom(2, 3); start = generateRandom(3, 15); }
                }

                let current = start;
                for(let i=0; i<4; i++) {
                    seq.push(current);
                    if (type === 'arithmetic') current += step;
                    else current *= step;
                }
                answer = current;
                setQuestion({ sequence: seq, type: 'sequence', answer: answer, missing: 'next' });
                setUserAnswer('');
                setFeedback(null);
                return;
            }
            
            let actualMode = mode;
            if (mode === 'unknown') {
                const modes = ['add', 'sub', 'mul'];
                actualMode = modes[Math.floor(Math.random() * modes.length)];
            }

            if (mode === 'order') {
                if (difficulty === 'easy') {
                     let n1 = generateRandom(2, 10); let n2 = generateRandom(2, 5); let n3 = generateRandom(2, 5);
                     let expression = `${n1} + ${n2} × ${n3}`; answer = n1 + (n2 * n3);
                     setQuestion({ type: 'order', expression, answer });
                } else if (difficulty === 'medium') {
                     let n3 = generateRandom(2, 5); let target = generateRandom(2, 10); let sum = n3 * target;
                     let n1 = generateRandom(1, sum - 1); let n2 = sum - n1;
                     let expression = `(${n1} + ${n2}) : ${n3}`; answer = target;
                     setQuestion({ type: 'order', expression, answer });
                } else {
                    let n1 = generateRandom(5, 20); let n2 = generateRandom(2, 9); let n3 = generateRandom(2, 9); let n4 = generateRandom(1, 10);
                    let expression = `${n1} + ${n2} × ${n3} - ${n4}`; answer = n1 + (n2 * n3) - n4;
                    setQuestion({ type: 'order', expression, answer });
                }
                setUserAnswer('');
                setFeedback(null);
                return;
            }
            
            if (mode === 'weight') {
                const getExpr = (diff) => {
                    if (diff === 'easy') {
                        if (Math.random() > 0.5) {
                            const a = generateRandom(1, 20);
                            return { text: a.toString(), val: a };
                        } else {
                            const a = generateRandom(1, 10);
                            const b = generateRandom(1, 10);
                            return { text: `${a} + ${b}`, val: a + b };
                        }
                    } else if (diff === 'medium') {
                         const op = Math.random() > 0.5 ? '+' : '-';
                         const a = generateRandom(10, 40);
                         const b = generateRandom(1, 10);
                         if (op === '+') return { text: `${a} + ${b}`, val: a + b };
                         else return { text: `${a} - ${b}`, val: a - b };
                    } else {
                         const op = Math.random() > 0.5 ? '+' : (Math.random() > 0.5 ? '-' : '×');
                         const a = generateRandom(1, 20);
                         const b = generateRandom(1, 10);
                         const c = generateRandom(1, 20);
                         if (op === '+') return { text: `${a} + ${b} + ${c}`, val: a + b + c };
                         else if (op === '-') return { text: `${a+b+c} - ${b}`, val: a + c };
                         else return { text: `${a} × ${b}`, val: a * b };
                    }
                };
                
                const left = getExpr(difficulty);
                const right = getExpr(difficulty);
                let ans = '=';
                if (left.val < right.val) ans = '<';
                if (left.val > right.val) ans = '>';
                
                setQuestion({ type: 'weight', leftExpr: left.text, rightExpr: right.text, valLeft: left.val, valRight: right.val, answer: ans });
                setUserAnswer('');
                setFeedback(null);
                return;
            }

            switch (actualMode) {
              case 'add':
                a = generateRandom(minVal, Math.floor(maxVal * 0.7));
                b = generateRandom(minVal, maxVal - a);
                operator = '+';
                result = a + b;
                break;
              case 'sub':
                a = generateRandom(minVal, maxVal);
                b = generateRandom(1, a - (maxVal > 10 ? 1 : 0));
                operator = '-';
                result = a - b;
                break;
              case 'mul':
                let maxFactor = Math.min(12, Math.floor(maxVal / 2));
                if (difficulty === 'easy') maxFactor = Math.min(10, maxVal);
                a = generateRandom(1, maxFactor);
                b = generateRandom(1, maxFactor);
                if (a * b > maxVal) a = generateRandom(1, Math.floor(maxVal / b));
                operator = '×';
                result = a * b;
                break;
              case 'div':
                let divisorMax = Math.min(12, maxVal);
                if (difficulty === 'easy') divisorMax = Math.min(10, maxVal);
                b = generateRandom(2, divisorMax);
                result = generateRandom(1, divisorMax); 
                a = b * result;
                operator = ':';
                if (a > maxVal) {
                    const maxResult = Math.floor(maxVal / b);
                    result = generateRandom(1, Math.max(1, maxResult));
                    a = b * result;
                }
                break;
            }
            if (isNaN(a) || isNaN(b)) { a = 1; b = 1; result = 2; }

            let term1 = a;
            let term2 = b;

            if (mode === 'unknown') {
                missing = Math.random() > 0.5 ? 'term1' : 'term2';
                answer = (missing === 'term1') ? term1 : term2;
            } else {
                missing = 'result';
                answer = result;
            }
            setQuestion({ term1, operator, term2, result, missing, answer });
            setUserAnswer('');
            setFeedback(null);
          };

          const handleSelectMode = (mode) => { setGameMode(mode); setGameDifficulty(null); setView('selectLevel'); };
          const startGame = (mode, difficulty) => {
            setGameMode(mode);
            setGameDifficulty(difficulty);
            setGameStats({ correct: 0, total: 0, xpGained: 0 });
            setView('game');
            generateQuestion(mode, difficulty);
          };
          const handleGameInput = (val) => {
            if (feedback === 'wrong') {
                setFeedback(null);
                if (val === 'backspace') {
                    setUserAnswer('');
                } else {
                    setUserAnswer(val);
                }
            } else {
                if (val === 'backspace') {
                    setUserAnswer(prev => prev.slice(0, -1));
                } else if (userAnswer.length < 4) {
                    setUserAnswer(prev => prev + val);
                }
            }
          };
          // Overload handleGameInput for weight mode to accept strings directly as full answer
          const onAnswerChange = (val) => {
             if (gameMode === 'weight') {
                 setUserAnswer(val);
                 // Optionally auto-check here, but user might want to change mind.
                 // Let's keep it simple: select, then check.
             } else {
                 handleGameInput(val);
             }
          };
          
          const checkAnswer = (sessionCorrectTimestamps, setSessionCorrectTimestamps) => {
            let isCorrect = false;
            if (gameMode === 'weight') {
                 isCorrect = userAnswer === question.answer;
            } else {
                const val = parseInt(userAnswer);
                if (isNaN(val)) return;
                isCorrect = val === question.answer;
            }
            
            const xpChange = isCorrect ? 10 : -5;
            
            let updatedUser = { ...currentUser }; 
            
            if (isCorrect) {
                SoundManager.playSuccess();
                updatedUser.consecutiveCorrect = (updatedUser.consecutiveCorrect || 0) + 1;
                const now = Date.now();
                const currentTimestamps = Array.isArray(sessionCorrectTimestamps) ? sessionCorrectTimestamps : [];
                const newTimestamps = [...currentTimestamps, now].filter(t => now - t <= 60000); 
                
                if (setSessionCorrectTimestamps) {
                    setSessionCorrectTimestamps(newTimestamps);
                }
                
                checkAchievements(updatedUser, newTimestamps);
            } else {
                SoundManager.playError();
                updatedUser.consecutiveCorrect = 0; 
            }

             try {
               db.users.update(currentUser.id, { consecutiveCorrect: updatedUser.consecutiveCorrect });
               setCurrentUser(prev => ({ ...prev, consecutiveCorrect: updatedUser.consecutiveCorrect }));
            } catch (e) { console.error(e); }


            setFeedback(isCorrect ? 'correct' : 'wrong');
            setGameStats(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1, xpGained: prev.xpGained + xpChange }));
            if (isCorrect) setTimeout(() => generateQuestion(gameMode, gameDifficulty), 1000);
          };
          const finishGame = () => { updateUserProgress(gameStats.xpGained); setView('summary'); };
          
          // FIX: Dodano zabezpieczenie sprawdzające czy gameDifficulty istnieje przed pobraniem nazwy
          const currentDifficultyName = gameDifficulty ? t(DIFFICULTY_LEVELS[gameDifficulty].nameKey) : '';

          return (
            <div className="font-sans text-slate-800 select-none">
              {view === 'profiles' && <ProfilesScreen users={users} currentUser={currentUser} onLogin={loginUser} onCreate={handleCreateUser} onDelete={handleDeleteUserClick} onCancelCreate={() => setView('dashboard')} onToggleLang={() => setLang(l => l === 'pl' ? 'en' : 'pl')} lang={lang} t={t} />}
              {view === 'dashboard' && currentUser && <DashboardScreen currentUser={currentUser} onChangeProfile={() => setView('profiles')} onSelectMode={handleSelectMode} onShowRanks={() => setView('ranks')} users={users} onShowShop={() => setView('shop')} onShowAchievements={() => setView('achievements')} t={t} />}
              {view === 'ranks' && currentUser && <RanksScreen currentXp={currentUser.totalXp || currentUser.xp} onReturn={() => setView('dashboard')} t={t} />}
              {view === 'shop' && currentUser && <ShopScreen user={currentUser} onBuy={handleBuyItem} onEquip={handleEquipItem} onReturn={() => setView('dashboard')} t={t} />}
              {view === 'achievements' && currentUser && <AchievementsScreen user={currentUser} onReturn={() => setView('dashboard')} t={t} />}
              {view === 'selectLevel' && gameMode && <LevelSelectionScreen mode={gameMode} onSelectLevel={startGame} onCancel={() => setView('dashboard')} t={t} user={currentUser} />}
              {view === 'game' && <GameScreen question={question} userAnswer={userAnswer} feedback={feedback} gameStats={gameStats} onAnswerChange={onAnswerChange} onCheckAnswer={checkAnswer} onFinishGame={finishGame} difficultyName={currentDifficultyName} t={t} user={currentUser} />}
              {view === 'summary' && <SummaryScreen gameStats={gameStats} dailyXp={currentUser?.dailyXp || 0} isDailyGoalMet={currentUser?.dailyGoalReached} onReturn={() => setView('dashboard')} currentUser={currentUser} t={t} user={currentUser} />}
              <DeleteConfirmationModal isOpen={!!userToDelete} onClose={() => setUserToDelete(null)} onConfirm={confirmDeleteUser} t={t} />
              
              {/* MODAL ODBLOKOWANIA ODZNAKI */}
              <AchievementUnlockedModal 
                achievement={justUnlockedAchievement} 
                onClose={() => setJustUnlockedAchievement(null)} 
                t={t}
              />
            </div>
          );
        }

        const domNode = document.getElementById('root');
        const root = ReactDOM.createRoot(domNode);
        root.render(<MathGalaxy />);
    </script>
</body>
</html>
