<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematyczna Galaktyka 🚀</title>
    <!-- Tailwind CSS dla stylizacji -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteki React i Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Dexie DB (Baza danych) -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- Canvas Confetti (Animacje cząsteczkowe) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Style dla dynamicznych teł */
        .bg-theme-default { background: linear-gradient(to bottom, #e0e7ff, #f3e8ff); }
        .bg-theme-nebula { background: linear-gradient(to bottom, #312e81, #4c1d95, #581c87); color: white; }
        .bg-theme-blackhole { background: linear-gradient(to bottom, #000000, #1e1b4b); color: white; }
        .bg-theme-supernova { background: linear-gradient(to bottom, #fff7ed, #ffedd5, #fed7aa); }

        /* Style dla skórek przycisków (nadpisują domyślne) */
        .btn-theme-neon { border-color: #39ff14 !important; box-shadow: 0 0 10px #39ff14 !important; }
        .btn-theme-gold { border-color: #ffd700 !important; border-width: 4px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SOUND MANAGER ---
        const SoundManager = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone: function(freq, type, duration, startTime = 0, vol = 0.1) {
                if (!this.ctx) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + startTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime + startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + startTime + duration);
                osc.stop(this.ctx.currentTime + startTime + duration);
            },
            playSuccess: function() { this.playTone(600, 'sine', 0.1); this.playTone(900, 'sine', 0.3, 0.1); },
            playError: function() { this.playTone(200, 'sawtooth', 0.2); this.playTone(150, 'sawtooth', 0.4, 0.1); },
            playClick: function() { this.playTone(800, 'triangle', 0.05, 0, 0.05); },
            playLevelUp: function() {
                const now = 0;
                this.playTone(523.25, 'square', 0.2, now);       
                this.playTone(659.25, 'square', 0.2, now + 0.2); 
                this.playTone(783.99, 'square', 0.2, now + 0.4); 
                this.playTone(1046.50, 'square', 0.6, now + 0.6); 
            },
            playBuy: function() { // Dźwięk kasy
                this.playTone(1200, 'sine', 0.1, 0, 0.1);
                this.playTone(1600, 'sine', 0.4, 0.1, 0.1);
            }
        };

        // --- KONFIGURACJA DEXIE DB ---
        const db = new Dexie('MathGalaxyDB');
        // Aktualizacja schematu bazy danych
        db.version(2).stores({
            users: '++id, name, xp, totalXp, streak, lastPlayed, dailyXp, dailyGoalReached, unlockedItems, activeBackground, activeSkin' 
        });

        // --- DANE SKLEPU ---
        const SHOP_ITEMS = [
            { id: 'av_alien', type: 'avatar', name: 'Kosmita', content: '👾', price: 300, desc: 'Przyjaciel z innej galaktyki.' },
            { id: 'av_dragon', type: 'avatar', name: 'Smok', content: '🐲', price: 500, desc: 'Strażnik matematycznego skarbu.' },
            { id: 'av_unicorn', type: 'avatar', name: 'Jednorożec', content: '🦄', price: 500, desc: 'Magiczne stworzenie.' },
            { id: 'av_hero', type: 'avatar', name: 'Superbohater', content: '🦸', price: 400, desc: 'Ratuj liczby przed chaosem!' },
            { id: 'av_fairy', type: 'avatar', name: 'Wróżka', content: '🧚', price: 300, desc: 'Dodaje magii do liczenia.' },
            { id: 'bg_nebula', type: 'background', name: 'Mgławica', content: 'bg-theme-nebula', price: 800, desc: 'Fioletowa otchłań kosmosu.', icon: '🌌' },
            { id: 'bg_blackhole', type: 'background', name: 'Czarna Dziura', content: 'bg-theme-blackhole', price: 1000, desc: 'Ciemny motyw dla odważnych.', icon: '⚫' },
            { id: 'bg_supernova', type: 'background', name: 'Supernowa', content: 'bg-theme-supernova', price: 600, desc: 'Jasny, ciepły wybuch.', icon: '☀️' },
            { id: 'skin_neon', type: 'skin', name: 'Neon', content: 'btn-theme-neon', price: 700, desc: 'Świecące przyciski.', icon: '🟢' },
            { id: 'skin_gold', type: 'skin', name: 'Złoto', content: 'btn-theme-gold', price: 1200, desc: 'Królewski styl.', icon: '🟡' },
        ];

        const DAILY_XP_GOAL = 200; 

        const RANKS = [
          { name: "Kadet", minXp: 0, icon: "👶" },
          { name: "Pilot", minXp: 500, icon: "✈️" },
          { name: "Astronauta", minXp: 1500, icon: "🧑‍🚀" },
          { name: "Kapitan", minXp: 3000, icon: "🎖️" },
          { name: "Komandor", minXp: 5000, icon: "🛸" },
          { name: "Admirał Galaktyki", minXp: 10000, icon: "👑" },
        ];

        // Podstawowe darmowe awatary - zmieniona nazwa zmiennej
        const BASE_AVATARS = ["👨‍🚀", "👩‍🚀", "🤖", "👽", "🐱", "🚀", "⭐", "🪐"];

        const DIFFICULTY_LEVELS = {
            easy: { name: "Łatwy (Ziemia)", color: "green", max: 30, description: "Liczby do 30." },
            medium: { name: "Średni (Mars)", color: "yellow", max: 100, description: "Liczby dwucyfrowe." },
            hard: { name: "Trudny (Jowisz)", color: "red", max: 1000, description: "Liczby trzycyfrowe." },
        };

        const getRank = (xp) => [...RANKS].reverse().find(r => xp >= r.minXp) || RANKS[0];
        const getNextRank = (xp) => RANKS.find(r => r.minXp > xp) || { name: "Max Level", minXp: xp };

        // --- KOMPONENTY UI ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Star: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
                Trophy: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"></path><path d="M6 9v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9"></path><path d="M12 15V9"></path></svg>,
                Zap: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
                User: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
                Plus: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>,
                ArrowLeft: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>,
                Check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>,
                X: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>,
                Award: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 11-2 5-2-5"></path><circle cx="12" cy="8" r="6"></circle><path d="M12 22a4 4 0 0 0 4-4v-1h-8v1a4 4 0 0 0 4 4Z"></path></svg>,
                RotateCcw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 5v7h7"/></svg>,
                Trash2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>,
                Target: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>,
                AlertTriangle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
                Lock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
                Unlock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>,
                HelpCircle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
                Radio: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg>,
                Crown: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>,
                Terminal: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>,
                ShoppingBag: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
                Coins: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>,
            };
            return <span className={className}>{icons[name] || '•'}</span>;
        };

        const Button = ({ onClick, children, className = "", variant = "primary", disabled = false }) => {
          const baseStyle = "px-6 py-3 rounded-2xl font-bold text-lg transition-all transform active:scale-95 shadow-lg flex items-center justify-center gap-2";
          const variants = {
            primary: "bg-indigo-600 text-white hover:bg-indigo-700 border-b-4 border-indigo-800",
            secondary: "bg-white text-indigo-600 hover:bg-gray-50 border-b-4 border-gray-200",
            success: "bg-green-500 text-white hover:bg-green-600 border-b-4 border-green-700",
            danger: "bg-red-500 text-white hover:bg-red-600 border-b-4 border-red-700",
            outline: "border-2 border-indigo-200 text-indigo-600 hover:bg-indigo-50"
          };

          return (
            <button 
              onClick={() => { SoundManager.playClick(); if(onClick) onClick(); }}
              disabled={disabled}
              className={`${baseStyle} ${variants[variant]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}
            >
              {children}
            </button>
          );
        };

        // POPRAWKA: Card teraz przyjmuje ...props, aby obsługiwać onClick
        const Card = ({ children, className = "", ...props }) => (
          <div className={`bg-white rounded-3xl shadow-xl p-6 ${className}`} {...props}>
            {children}
          </div>
        );

        // --- KOMPONENTY ---

        const DailyLeaderboard = ({ users, currentUserId }) => {
            if (users.length < 2) return null;
            const today = new Date().toDateString();
            const sortedUsers = users.map(u => ({
                ...u,
                displayDailyXp: u.lastPlayed === today ? (u.dailyXp || 0) : 0
            })).sort((a, b) => b.displayDailyXp - a.displayDailyXp);

            return (
                <Card className="mb-8 border-b-4 border-indigo-200 bg-gradient-to-br from-white to-indigo-50 w-full">
                    <div className="flex items-center gap-3 mb-4">
                        <div className="p-2 bg-yellow-100 rounded-full text-yellow-600"><Icon name="Crown" size={24} /></div>
                        <div><h3 className="text-lg font-bold text-indigo-900">Ranking Dnia</h3><p className="text-xs text-indigo-500">Kto dzisiaj trenował najciężej?</p></div>
                    </div>
                    <div className="space-y-2">
                        {sortedUsers.map((user, index) => {
                            const isCurrentUser = user.id === currentUserId;
                            let rankIcon = null;
                            let rowClass = "bg-white border border-indigo-100";
                            if (index === 0) { rankIcon = "🥇"; rowClass = "bg-yellow-50 border-yellow-200"; }
                            else if (index === 1) { rankIcon = "🥈"; rowClass = "bg-gray-50 border-gray-200"; }
                            else if (index === 2) { rankIcon = "🥉"; rowClass = "bg-orange-50 border-orange-200"; }
                            return (
                                <div key={user.id} className={`flex items-center justify-between p-3 rounded-xl ${rowClass} ${isCurrentUser ? 'ring-2 ring-indigo-400 shadow-md' : ''}`}>
                                    <div className="flex items-center gap-3">
                                        <div className="font-bold text-gray-400 w-6 text-center">{rankIcon || index + 1}</div>
                                        <div className="text-2xl">{user.avatar}</div>
                                        <div className="flex flex-col">
                                            <span className={`font-bold ${isCurrentUser ? 'text-indigo-700' : 'text-gray-700'}`}>{user.name} {isCurrentUser && "(Ty)"}</span>
                                            {/* Używamy totalXp do rangi jeśli istnieje, fallback do xp */}
                                            <span className="text-[10px] text-gray-400 font-medium uppercase">{getRank(user.totalXp || user.xp).name}</span>
                                        </div>
                                    </div>
                                    <div className="font-bold text-indigo-600 bg-white/50 px-3 py-1 rounded-lg">{user.displayDailyXp} XP</div>
                                </div>
                            );
                        })}
                    </div>
                </Card>
            );
        };

        const DeleteConfirmationModal = ({ isOpen, onClose, onConfirm }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl transform animate-bounce-in text-center">
                        <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500"><Icon name="Trash2" size={40} /></div>
                        <h3 className="text-2xl font-bold text-gray-800 mb-2">Usunąć profil?</h3>
                        <p className="text-gray-500 mb-8">Czy na pewno chcesz usunąć tego kosmonautę?</p>
                        <div className="flex flex-col gap-3"><Button variant="danger" onClick={onConfirm}>Tak, usuń profil</Button><Button variant="secondary" onClick={onClose}>Nie, zachowaj</Button></div>
                    </div>
                </div>
            );
        };

        // --- NOWY EKRAN: SKLEP ---
        const ShopScreen = ({ user, onBuy, onEquip, onReturn }) => {
            return (
                <div className="min-h-screen bg-white/90 p-4 flex flex-col items-center">
                    <div className="w-full max-w-4xl mb-6 flex items-center justify-between mt-4">
                        <Button variant="secondary" onClick={onReturn} className="px-4 py-2 text-sm"><Icon name="ArrowLeft" size={16} /> Wróć</Button>
                        <div className="flex items-center gap-4">
                             <div className="flex flex-col items-end">
                                <span className="text-xs text-gray-500 font-bold uppercase">Twój Portfel</span>
                                <span className="text-2xl font-black text-indigo-600 flex items-center gap-2">{user.xp} <Icon name="Coins" className="text-yellow-500"/></span>
                             </div>
                        </div>
                    </div>

                    <h2 className="text-3xl font-extrabold text-indigo-900 mb-2 flex items-center gap-2"><Icon name="ShoppingBag" size={32} /> Kosmiczny Sklepik</h2>
                    <p className="text-gray-500 mb-8">Wydawaj XP na super nagrody! Nie martw się, Twoja ranga nie spadnie.</p>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
                        {/* Sekcja: Awatary */}
                        <div className="col-span-1 md:col-span-3"><h3 className="text-xl font-bold text-gray-700 border-b-2 border-gray-100 pb-2 mb-4">Nowe Postacie</h3></div>
                        {SHOP_ITEMS.filter(i => i.type === 'avatar').map(item => {
                            const isOwned = user.unlockedItems?.includes(item.id);
                            const isEquipped = user.avatar === item.content;
                            return (
                                <Card key={item.id} className={`flex flex-col items-center text-center border-2 ${isEquipped ? 'border-green-500 bg-green-50' : 'border-gray-100'}`}>
                                    <div className="text-6xl mb-4">{item.content}</div>
                                    <h4 className="font-bold text-lg">{item.name}</h4>
                                    <p className="text-sm text-gray-500 mb-4">{item.desc}</p>
                                    {isOwned ? (
                                        <Button 
                                            onClick={() => !isEquipped && onEquip(item)} 
                                            variant={isEquipped ? 'success' : 'secondary'}
                                            disabled={isEquipped}
                                            className="w-full text-sm"
                                        >
                                            {isEquipped ? 'Używasz' : 'Wybierz'}
                                        </Button>
                                    ) : (
                                        <Button 
                                            onClick={() => onBuy(item)} 
                                            disabled={user.xp < item.price}
                                            className={`w-full text-sm ${user.xp < item.price ? 'opacity-50' : ''}`}
                                        >
                                            Kup za {item.price} XP
                                        </Button>
                                    )}
                                </Card>
                            );
                        })}

                        {/* Sekcja: Tła */}
                        <div className="col-span-1 md:col-span-3 mt-4"><h3 className="text-xl font-bold text-gray-700 border-b-2 border-gray-100 pb-2 mb-4">Kosmiczne Tła</h3></div>
                        {SHOP_ITEMS.filter(i => i.type === 'background').map(item => {
                            const isOwned = user.unlockedItems?.includes(item.id);
                            const isEquipped = user.activeBackground === item.content;
                            return (
                                <Card key={item.id} className={`flex flex-col items-center text-center border-2 ${isEquipped ? 'border-green-500 bg-green-50' : 'border-gray-100'}`}>
                                    <div className={`w-full h-24 rounded-xl mb-4 ${item.content} flex items-center justify-center text-4xl`}>{item.icon}</div>
                                    <h4 className="font-bold text-lg">{item.name}</h4>
                                    <p className="text-sm text-gray-500 mb-4">{item.desc}</p>
                                    {isOwned ? (
                                        <Button onClick={() => !isEquipped && onEquip(item)} variant={isEquipped ? 'success' : 'secondary'} disabled={isEquipped} className="w-full text-sm">

                       <div className="w-full bg-gray-200 rounded-full h-4 overflow-hidden"><div className={`h-full transition-all duration-1000 bg-green-500`} style={{ width: `${Math.min(100, ((currentUser.dailyXp || 0) / DAILY_XP_GOAL) * 100)}%` }}></div></div>

                            return (
                                <div key={rank.name} className={`relative flex items-center gap-4 p-4 rounded-2xl border-4 transition-all ${isCurrent ? 'bg-white border-yellow-400 scale-105 shadow-[0_0_20px_rgba(250,204,21,0.5)] z-10' : isUnlocked ? 'bg-indigo-800 border-indigo-600 text-indigo-100' : 'bg-gray-800 border-gray-700 text-gray-500 opacity-70'}`}>
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl border-2 ${isUnlocked ? 'bg-indigo-100 border-indigo-300' : 'bg-gray-700 border-gray-600'}`}>{rank.icon}</div>

        const GameScreen = ({ question, userAnswer, feedback, gameStats, onAnswerChange, onCheckAnswer, onFinishGame, difficultyName }) => {
            if (!question) return <div className="min-h-screen flex items-center justify-center bg-indigo-50 font-bold text-indigo-500">Ładowanie misji...</div>;

            // Obsługa klawiatury
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') {
                        if (userAnswer && feedback !== 'correct') onCheckAnswer();
                    } else if (e.key === 'Backspace') {
                        onAnswerChange('backspace');
                    } else if (!isNaN(parseInt(e.key))) {
                        onAnswerChange(e.key);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [userAnswer, feedback]);

            if (question.type === 'sequence') {
                const activeInputStyle = `min-w-[80px] sm:min-w-[100px] inline-block border-b-4 ${userAnswer ? 'text-indigo-800 border-indigo-500' : 'text-gray-300 border-gray-200'}`;
                return (
                    <div className="min-h-screen bg-indigo-50 flex flex-col">
                    <div className="p-4 flex justify-between items-center max-w-4xl mx-auto w-full">

        // --- GŁÓWNY KOMPONENT ---

        function MathGalaxy() {
          const [users, setUsers] = useState(() => {
            try {
              const saved = localStorage.getItem('mathGalaxyUsers');
              return saved ? JSON.parse(saved) : [];
            } catch (e) {
              console.error("Błąd odczytu localStorage:", e);
              return [];
            }
          });
          const [view, setView] = useState('profiles');
          const [currentUser, setCurrentUser] = useState(null);
          const [gameMode, setGameMode] = useState(null);
          const [gameDifficulty, setGameDifficulty] = useState(null);
          const [question, setQuestion] = useState(null);
          const [userAnswer, setUserAnswer] = useState('');
          const [feedback, setFeedback] = useState(null);
          const [gameStats, setGameStats] = useState({ correct: 0, total: 0, xpGained: 0 });
          const [userToDelete, setUserToDelete] = useState(null);

          useEffect(() => {
            try {
              localStorage.setItem('mathGalaxyUsers', JSON.stringify(users));
            } catch (e) {
              console.error("Błąd zapisu localStorage:", e);
            }
          }, [users]);

          const handleCreateUser = async (name, avatar) => {
            const newUser = { id: Date.now(), name, avatar, xp: 0, totalXp: 0, streak: 0, lastPlayed: null, dailyXp: 0, dailyGoalReached: false, history: [], unlockedItems: [], activeBackground: '', activeSkin: '' };
            try {
              const id = await db.users.add(newUser);
              const userWithId = { ...newUser, id };
              setUsers([...users, userWithId]);
              loginUser(userWithId, [...users, userWithId]);
            } catch (e) {
              console.error("Błąd tworzenia użytkownika:", e);
            }
          };
          const handleDeleteUserClick = (userId) => setUserToDelete(userId);
          const confirmDeleteUser = async () => {
            if (userToDelete) {
                try {
                  await db.users.delete(userToDelete);
                  const updatedUsers = users.filter(u => u.id !== userToDelete);
                  setUsers(updatedUsers);
                  if (currentUser?.id === userToDelete) setCurrentUser(null);
                  setUserToDelete(null);
                } catch (e) {
                  console.error("Błąd usuwania użytkownika:", e);
                }
            }
          };
          const loginUser = async (user, currentUsersList = users) => {
            const today = new Date().toDateString();
            let updatedUser = { ...user };
            if (!updatedUser.totalXp) updatedUser.totalXp = updatedUser.xp; // Migracja starych użytkowników

            let needsUpdate = false;

            if (user.lastPlayed !== today) {
               updatedUser.dailyXp = 0;
               updatedUser.dailyGoalReached = false;
               const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
               if (user.lastPlayed && user.lastPlayed !== yesterday.toDateString()) {
                  updatedUser.streak = 0; 
               }
               needsUpdate = true;
            }
            
            if (needsUpdate) {
              try {
                await db.users.update(user.id, updatedUser);
                const updatedList = currentUsersList.map(u => u.id === user.id ? updatedUser : u);
                setUsers(updatedList);
              } catch (e) {
                console.error("Błąd aktualizacji logowania:", e);
              }
            }
            setCurrentUser(updatedUser);
            setView('dashboard');
          };

          const handleBuyItem = async (item) => {
              if (!currentUser) return;
              if (currentUser.xp < item.price) return;

              const updatedUser = { ...currentUser, xp: currentUser.xp - item.price, unlockedItems: [...(currentUser.unlockedItems || []), item.id] };
              
              // Automatyczne wyposażenie
              if (item.type === 'avatar') updatedUser.avatar = item.content;
              if (item.type === 'background') updatedUser.activeBackground = item.content;
              if (item.type === 'skin') updatedUser.activeSkin = item.content;

              try {
                  await db.users.update(currentUser.id, updatedUser);
                  setCurrentUser(updatedUser);
                  setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
                  SoundManager.playBuy();
              } catch (e) { console.error("Błąd zakupu:", e); }
          };

          const handleEquipItem = async (item) => {
              if (!currentUser) return;
              const updatedUser = { ...currentUser };
              if (item.type === 'avatar') updatedUser.avatar = item.content;
              if (item.type === 'background') updatedUser.activeBackground = item.content;
              if (item.type === 'skin') updatedUser.activeSkin = item.content;

              try {
                  await db.users.update(currentUser.id, updatedUser);
                  setCurrentUser(updatedUser);
                  setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
              } catch (e) { console.error("Błąd wyposażania:", e); }
          };

          const updateUserProgress = async (xpGained) => {
            if (!currentUser) return;
            const today = new Date().toDateString();
            let updatedUser = { ...currentUser };
            updatedUser.xp += xpGained;
            updatedUser.totalXp = (updatedUser.totalXp || 0) + xpGained; // Total XP zawsze rośnie

            const newDailyXp = (updatedUser.dailyXp || 0) + xpGained;
            updatedUser.dailyXp = Math.max(0, newDailyXp);
            updatedUser.lastPlayed = today;
            if (updatedUser.dailyXp >= DAILY_XP_GOAL && !updatedUser.dailyGoalReached) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                SoundManager.playLevelUp();
                updatedUser.streak += 1;
                updatedUser.dailyGoalReached = true;
            }
            
            try {
               await db.users.update(currentUser.id, updatedUser);
               setCurrentUser(updatedUser);
               setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
            } catch (e) {
               console.error("Błąd aktualizacji postępu:", e);
            }
          };

          const generateQuestion = (mode, difficulty) => {
            const maxVal = DIFFICULTY_LEVELS[difficulty].max;
            let a = 1, b = 1, operator = '+', result = 2, answer = 2;
            let missing = 'result';
            
            let minVal = 1;
            if (difficulty === 'medium') minVal = 10;
            if (difficulty === 'hard') minVal = 100;

            const generateRandom = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            if (mode === 'sequences') {
                let seq = [];
                let step, start, type;
                if (difficulty === 'easy') {
                    type = 'arithmetic';
                    step = generateRandom(1, 5);
                    start = generateRandom(1, 10);
                } else if (difficulty === 'medium') {
                    type = Math.random() > 0.3 ? 'arithmetic' : 'geometric';
                    if (type === 'arithmetic') { step = generateRandom(3, 10); start = generateRandom(5, 30); } 
                    else { step = 2; start = generateRandom(2, 10); }
                } else { 
                    type = Math.random() > 0.5 ? 'arithmetic' : 'geometric';
                    if (type === 'arithmetic') { step = generateRandom(7, 25); start = generateRandom(20, 100); } 
                    else { step = generateRandom(2, 3); start = generateRandom(3, 15); }
                }

                let current = start;
                for(let i=0; i<4; i++) {
                    seq.push(current);
                    if (type === 'arithmetic') current += step;
                    else current *= step;
                }
                answer = current;
                setQuestion({ sequence: seq, type: 'sequence', answer: answer, missing: 'next' });
                setUserAnswer('');
                setFeedback(null);
                return;
            }
            
            let actualMode = mode;
            if (mode === 'unknown') {
                const modes = ['add', 'sub', 'mul'];
                actualMode = modes[Math.floor(Math.random() * modes.length)];
            }

            if (mode === 'order') {
                if (difficulty === 'easy') {
                     let n1 = generateRandom(2, 10); let n2 = generateRandom(2, 5); let n3 = generateRandom(2, 5);
                     let expression = `${n1} + ${n2} × ${n3}`; answer = n1 + (n2 * n3);
                     setQuestion({ type: 'order', expression, answer });
                } else if (difficulty === 'medium') {
                     let n3 = generateRandom(2, 5); let target = generateRandom(2, 10); let sum = n3 * target;
                     let n1 = generateRandom(1, sum - 1); let n2 = sum - n1;
                     let expression = `(${n1} + ${n2}) : ${n3}`; answer = target;
                     setQuestion({ type: 'order', expression, answer });
                } else {
                    let n1 = generateRandom(5, 20); let n2 = generateRandom(2, 9); let n3 = generateRandom(2, 9); let n4 = generateRandom(1, 10);
                    let expression = `${n1} + ${n2} × ${n3} - ${n4}`; answer = n1 + (n2 * n3) - n4;
                    setQuestion({ type: 'order', expression, answer });
                }
                setUserAnswer('');
                setFeedback(null);
                return;
            }

            switch (actualMode) {
              case 'add':
                a = generateRandom(minVal, Math.floor(maxVal * 0.7));
                b = generateRandom(minVal, maxVal - a);
                operator = '+';
                result = a + b;
                break;
              case 'sub':
                a = generateRandom(minVal, maxVal);
                b = generateRandom(1, a - (maxVal > 10 ? 1 : 0));
                operator = '-';
                result = a - b;
                break;
              case 'mul':
                let maxFactor = Math.min(12, Math.floor(maxVal / 2));
                if (difficulty === 'easy') maxFactor = Math.min(10, maxVal);
                a = generateRandom(1, maxFactor);
                b = generateRandom(1, maxFactor);
                if (a * b > maxVal) a = generateRandom(1, Math.floor(maxVal / b));
                operator = '×';
                result = a * b;
                break;
              case 'div':
                let divisorMax = Math.min(12, maxVal);
                if (difficulty === 'easy') divisorMax = Math.min(10, maxVal);
                b = generateRandom(2, divisorMax);
                result = generateRandom(1, divisorMax); 
                a = b * result;
                operator = ':';
                if (a > maxVal) {
                    const maxResult = Math.floor(maxVal / b);
                    result = generateRandom(1, Math.max(1, maxResult));
                    a = b * result;
                }
                break;
            }
            if (isNaN(a) || isNaN(b)) { a = 1; b = 1; result = 2; }

            let term1 = a;
            let term2 = b;

            if (mode === 'unknown') {
                missing = Math.random() > 0.5 ? 'term1' : 'term2';
                answer = (missing === 'term1') ? term1 : term2;
            } else {
                missing = 'result';
                answer = result;
            }
            setQuestion({ term1, operator, term2, result, missing, answer });
            setUserAnswer('');
            setFeedback(null);
          };

          const handleSelectMode = (mode) => { setGameMode(mode); setGameDifficulty(null); setView('selectLevel'); };
          const startGame = (mode, difficulty) => {
            setGameMode(mode);
            setGameDifficulty(difficulty);
            setGameStats({ correct: 0, total: 0, xpGained: 0 });
            setView('game');
            generateQuestion(mode, difficulty);
          };
          const handleGameInput = (val) => {
            if (val === 'backspace') setUserAnswer(prev => prev.slice(0, -1));
            else if (userAnswer.length < 4) setUserAnswer(prev => prev + val);
          };
          const checkAnswer = () => {
            const val = parseInt(userAnswer);
            if (isNaN(val)) return;
            const isCorrect = val === question.answer;
            const xpChange = isCorrect ? 10 : -5;
            
            if (isCorrect) {
                SoundManager.playSuccess();
            } else {
                SoundManager.playError();
            }

            setFeedback(isCorrect ? 'correct' : 'wrong');
            setGameStats(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1, xpGained: prev.xpGained + xpChange }));
            if (isCorrect) setTimeout(() => generateQuestion(gameMode, gameDifficulty), 1000);
          };
          const finishGame = () => { updateUserProgress(gameStats.xpGained); setView('summary'); };
          const currentDifficultyName = gameDifficulty ? DIFFICULTY_LEVELS[gameDifficulty].name : 'Nieznany';

          return (
            <div className="font-sans text-slate-800 select-none">
              {view === 'profiles' && <ProfilesScreen users={users} currentUser={currentUser} onLogin={loginUser} onCreate={handleCreateUser} onDelete={handleDeleteUserClick} onCancelCreate={() => setView('dashboard')} />}
              {view === 'dashboard' && currentUser && <DashboardScreen currentUser={currentUser} onChangeProfile={() => setView('profiles')} onSelectMode={handleSelectMode} onShowRanks={() => setView('ranks')} users={users} onShowShop={() => setView('shop')} />}
              {view === 'ranks' && currentUser && <RanksScreen currentXp={currentUser.totalXp || currentUser.xp} onReturn={() => setView('dashboard')} />}
              {view === 'shop' && currentUser && <ShopScreen user={currentUser} onBuy={handleBuyItem} onEquip={handleEquipItem} onReturn={() => setView('dashboard')} />}
              {view === 'selectLevel' && gameMode && <LevelSelectionScreen mode={gameMode} onSelectLevel={startGame} onCancel={() => setView('dashboard')} />}
              {view === 'game' && <GameScreen question={question} userAnswer={userAnswer} feedback={feedback} gameStats={gameStats} onAnswerChange={handleGameInput} onCheckAnswer={checkAnswer} onFinishGame={finishGame} difficultyName={currentDifficultyName} />}
              {view === 'summary' && <SummaryScreen gameStats={gameStats} dailyXp={currentUser?.dailyXp || 0} isDailyGoalMet={currentUser?.dailyGoalReached} onReturn={() => setView('dashboard')} currentUser={currentUser} />}
              <DeleteConfirmationModal isOpen={!!userToDelete} onClose={() => setUserToDelete(null)} onConfirm={confirmDeleteUser} />
            </div>
          );
        }

        const domNode = document.getElementById('root');
        const root = ReactDOM.createRoot(domNode);
        root.render(<MathGalaxy />);
    </script>
</body>
</html>
