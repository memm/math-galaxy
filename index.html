<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematyczna Galaktyka 🚀</title>
    <!-- Tailwind CSS dla stylizacji -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteki React i Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Ustawienie głównej czcionki */
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <!-- Główny kontener, w którym osadzimy aplikację React -->
    <div id="root"></div>

    <script type="text/babel">
        // --- STAŁE I DANE ---

        const DAILY_XP_GOAL = 200; // Wymagane XP dziennie

        const RANKS = [
          { name: "Kadet", minXp: 0 },
          { name: "Pilot", minXp: 500 },
          { name: "Astronauta", minXp: 1500 },
          { name: "Kapitan", minXp: 3000 },
          { name: "Komandor", minXp: 5000 },
          { name: "Admirał Galaktyki", minXp: 10000 },
        ];

        const AVATARS = ["👨‍🚀", "👩‍🚀", "🤖", "👽", "🐱‍🚀", "🚀", "⭐", "🪐"];

        const getRank = (xp) => {
          return [...RANKS].reverse().find(r => xp >= r.minXp) || RANKS[0];
        };

        const getNextRank = (xp) => {
          return RANKS.find(r => r.minXp > xp) || { name: "Max Level", minXp: xp };
        };

        // --- KOMPONENTY UI (Zastąpienie Lucide Icons prostymi SVG lub Unicode) ---

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Star: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
                Trophy: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"></path><path d="M6 9v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9"></path><path d="M12 15V9"></path></svg>,
                Zap: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
                User: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
                Plus: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>,
                ArrowLeft: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>,
                Check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>,
                X: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>,
                Award: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 11-2 5-2-5"></path><circle cx="12" cy="8" r="6"></circle><path d="M12 22a4 4 0 0 0 4-4v-1h-8v1a4 4 0 0 0 4 4Z"></path></svg>,
                RotateCcw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 4v6h6"></path><path d="M3 10a8 8 0 1 0 3.45-12.85"></path></svg>,
                Trash2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>,
                Target: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>,
            };
            return <span className={className}>{icons[name] || '•'}</span>;
        };


        const Button = ({ onClick, children, className = "", variant = "primary", disabled = false }) => {
          const baseStyle = "px-6 py-3 rounded-2xl font-bold text-lg transition-all transform active:scale-95 shadow-lg flex items-center justify-center gap-2";
          const variants = {
            primary: "bg-indigo-600 text-white hover:bg-indigo-700 border-b-4 border-indigo-800",
            secondary: "bg-white text-indigo-600 hover:bg-gray-50 border-b-4 border-gray-200",
            success: "bg-green-500 text-white hover:bg-green-600 border-b-4 border-green-700",
            danger: "bg-red-500 text-white hover:bg-red-600 border-b-4 border-red-700",
            outline: "border-2 border-indigo-200 text-indigo-600 hover:bg-indigo-50"
          };

          return (
            <button 
              onClick={onClick} 
              disabled={disabled}
              className={`${baseStyle} ${variants[variant]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}
            >
              {children}
            </button>
          );
        };

        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-3xl shadow-xl p-6 ${className}`}>
            {children}
          </div>
        );

        // --- EKRANY ---

        const ProfilesScreen = ({ users, currentUser, onLogin, onCreate, onDelete, onCancelCreate }) => {
          const [isCreating, setIsCreating] = React.useState(false);
          const [newName, setNewName] = React.useState('');
          const [selectedAvatar, setSelectedAvatar] = React.useState(AVATARS[0]);

          const handleCreateClick = () => {
            if (!newName.trim()) return;
            onCreate(newName, selectedAvatar);
            setIsCreating(false);
            setNewName('');
          };

          if (isCreating) {
            return (
              <div className="flex flex-col items-center justify-center min-h-screen bg-indigo-50 p-4">
                <Card className="w-full max-w-md text-center">
                  <h2 className="text-3xl font-bold text-indigo-800 mb-6">Nowy Kosmonauta</h2>
                  
                  <div className="mb-6">
                    <p className="text-gray-600 mb-2">Wybierz swój wygląd:</p>
                    <div className="flex flex-wrap justify-center gap-2">
                      {AVATARS.map(av => (
                        <button
                          key={av}
                          onClick={() => setSelectedAvatar(av)}
                          className={`text-4xl p-3 rounded-xl border-2 transition-all ${selectedAvatar === av ? 'bg-indigo-100 border-indigo-500 scale-110' : 'border-transparent hover:bg-gray-100'}`}
                        >
                          {av}
                        </button>
                      ))}
                    </div>
                  </div>

                  <input
                    type="text"
                    placeholder="Twoje imię"
                    value={newName}
                    onChange={(e) => setNewName(e.target.value)}
                    className="w-full text-center text-xl p-3 border-2 border-indigo-200 rounded-xl focus:border-indigo-500 focus:outline-none mb-6"
                  />

                  <div className="flex gap-4 justify-center">
                    <Button variant="secondary" onClick={() => setIsCreating(false)}>Anuluj</Button>
                    <Button 
                      disabled={!newName.trim()} 
                      onClick={handleCreateClick}
                    >
                      Stwórz
                    </Button>
                  </div>
                </Card>
              </div>
            );
          }

          return (
            <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-indigo-100 to-purple-100 p-4 relative">
              
              {currentUser && (
                 <div className="absolute top-4 left-4">
                    <Button variant="secondary" onClick={onCancelCreate} className="text-sm py-2 px-4">
                      <Icon name="ArrowLeft" size={16} /> Wróć do gry
                    </Button>
                 </div>
              )}

              <div className="text-center mb-8 mt-8">
                <h1 className="text-4xl md:text-5xl font-extrabold text-indigo-900 mb-2 tracking-tight">Matematyczna Galaktyka</h1>
                <p className="text-indigo-600 text-lg font-medium">Wybierz pilota misji:</p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl mb-8">
                {users.length === 0 && (
                  <div className="col-span-1 sm:col-span-2 text-center text-gray-500 italic mb-4 bg-white/50 p-4 rounded-xl">
                    Brak zapisanych profili. Stwórz pierwszego kosmonautę!
                  </div>
                )}

                {users.map(user => (
                  <div key={user.id} className="relative group">
                    <button
                      onClick={() => onLogin(user)}
                      className={`w-full bg-white p-6 rounded-3xl shadow-md hover:shadow-xl transform hover:-translate-y-1 transition-all flex items-center gap-4 text-left border-4 ${currentUser?.id === user.id ? 'border-green-400 bg-green-50' : 'border-transparent hover:border-indigo-200'}`}
                    >
                      <div className="text-5xl bg-indigo-50 p-4 rounded-2xl">{user.avatar}</div>
                      <div className="flex-1">
                        <h3 className="text-2xl font-bold text-gray-800">{user.name} {currentUser?.id === user.id && <span className="text-sm text-green-600 ml-2">(Ty)</span>}</h3>
                        <div className="flex items-center gap-2">
                          <Icon name="Trophy" size={14} className="text-yellow-500" />
                          <p className="text-indigo-500 font-medium text-sm">{getRank(user.xp).name}</p>
                        </div>
                        <p className="text-xs text-gray-400 mt-1">Poziom: {Math.floor(user.xp / 100) + 1}</p>
                      </div>
                    </button>
                    
                    <button 
                      onClick={(e) => onDelete(e, user.id)}
                      className="absolute top-4 right-4 p-2 bg-white/80 rounded-full shadow-sm text-gray-400 hover:text-red-500 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100 z-10"
                      title="Usuń profil"
                    >
                      <Icon name="Trash2" size={20} />
                    </button>
                  </div>
                ))}
                
                <button
                  onClick={() => setIsCreating(true)}
                  className="bg-indigo-50/80 p-6 rounded-3xl border-4 border-dashed border-indigo-300 hover:bg-indigo-100 hover:border-indigo-400 transition-all flex flex-col items-center justify-center gap-2 text-indigo-500 hover:text-indigo-700 min-h-[140px]"
                >
                  <Icon name="Plus" size={40} />
                  <span className="font-bold">Dodaj Kosmonautę</span>
                </button>
              </div>
            </div>
          );
        };

        const DashboardScreen = ({ currentUser, onChangeProfile, onStartGame }) => {
          const rank = getRank(currentUser.xp);
          const nextRank = getNextRank(currentUser.xp);
          const progress = Math.min(100, ((currentUser.xp - rank.minXp) / (nextRank.minXp - rank.minXp)) * 100);
          
          // Obliczenia dla dziennego celu
          const dailyProgress = Math.min(100, ((currentUser.dailyXp || 0) / DAILY_XP_GOAL) * 100);
          const isDailyGoalMet = (currentUser.dailyXp || 0) >= DAILY_XP_GOAL;

          return (
            <div className="min-h-screen bg-gray-50 pb-10">
              {/* Header */}
              <div className="bg-indigo-600 p-6 pb-32 rounded-b-[3rem] text-white shadow-lg relative overflow-hidden">
                 <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                    <Icon name="Star" className="absolute top-10 left-10 w-12 h-12 text-yellow-300" />
                    <Icon name="Star" className="absolute top-20 right-20 w-8 h-8 text-yellow-200" />
                    <div className="absolute bottom-10 right-10 w-20 h-20 rounded-full bg-white/10 blur-2xl"></div>
                 </div>

                <div className="max-w-4xl mx-auto flex justify-between items-start relative z-10">
                   <div className="flex items-center gap-4">
                      <div className="text-6xl bg-white/20 p-3 rounded-3xl backdrop-blur-sm shadow-inner">{currentUser.avatar}</div>
                      <div>
                        <h1 className="text-3xl font-bold drop-shadow-md">Cześć, {currentUser.name}!</h1>
                        <div className="flex items-center gap-2 text-indigo-100 font-medium">
                           <Icon name="Trophy" size={18} className="text-yellow-400" />
                           <span>Ranga: {rank.name}</span>
                        </div>
                      </div>
                   </div>
                   <button onClick={onChangeProfile} className="bg-indigo-700/50 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl transition flex items-center gap-2 text-sm font-bold border border-indigo-500">
                     <Icon name="User" size={16} /> Zmień
                   </button>
                </div>
                
                {/* Pasek Postępu Rangi */}
                <div className="max-w-4xl mx-auto mt-8 bg-indigo-900/40 rounded-full p-1 backdrop-blur-md border border-indigo-500/30 relative z-10">
                   <div className="flex justify-between text-xs font-bold uppercase tracking-wider px-3 mb-1 text-indigo-200">
                     <span>XP: {currentUser.xp}</span>
                     <span>Cel: {nextRank.name} ({nextRank.minXp} XP)</span>
                   </div>
                   <div className="w-full bg-indigo-900/50 rounded-full h-4 overflow-hidden">
                     <div 
                       className="bg-gradient-to-r from-yellow-400 to-orange-500 h-4 rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(250,204,21,0.5)]"
                       style={{ width: `${progress}%` }}
                     ></div>
                   </div>
                </div>
              </div>

              {/* Statystyki i Gry - Przesunięte wyżej */}
              <div className="max-w-4xl mx-auto px-4 -mt-24 relative z-10">
                
                {/* Sekcja Celu Dziennego - Nowa Karta */}
                <Card className="mb-6 border-b-4 border-blue-400 bg-white shadow-lg">
                   <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                     <div className="flex items-center gap-4">
                       <div className={`p-3 rounded-full ${isDailyGoalMet ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-600'}`}>
                         <Icon name="Target" size={32} />
                       </div>
                       <div>
                         <h3 className="text-lg font-bold text-gray-800">Cel Dnia: {DAILY_XP_GOAL} XP</h3>
                         <p className="text-sm text-gray-500">Zdobądź XP, aby zaliczyć dzień treningu!</p>
                       </div>
                     </div>
                     
                     <div className="w-full sm:w-1/2">
                       <div className="flex justify-between text-sm font-bold mb-1">
                         <span className="text-gray-600">{currentUser.dailyXp || 0} / {DAILY_XP_GOAL} XP</span>
                         {isDailyGoalMet && <span className="text-green-600 flex items-center gap-1"><Icon name="Check" size={14}/> Zaliczono!</span>}
                       </div>
                       <div className="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                          <div 
                             className={`h-full transition-all duration-1000 ${isDailyGoalMet ? 'bg-green-500' : 'bg-blue-500'}`}
                             style={{ width: `${dailyProgress}%` }}
                          ></div>
                       </div>
                     </div>
                   </div>
                </Card>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                  <Card className="flex flex-col items-center justify-center text-center py-4 border-b-4 border-yellow-400">
                    <Icon name="Zap" className={`mb-2 ${isDailyGoalMet ? 'text-yellow-500 fill-yellow-500' : 'text-gray-300'}`} size={32} />
                    <span className="text-3xl font-bold text-gray-800">{currentUser.streak}</span>
                    <span className="text-xs text-gray-500 uppercase font-bold">Dni z rzędu</span>
                  </Card>
                  <Card className="flex flex-col items-center justify-center text-center py-4 border-b-4 border-purple-400">
                    <Icon name="Award" className="text-purple-500 mb-2" size={32} />
                    <span className="text-3xl font-bold text-gray-800">{Math.floor(currentUser.xp / 100) + 1}</span>
                    <span className="text-xs text-gray-500 uppercase font-bold">Poziom</span>
                  </Card>
                   <Card className="hidden md:flex flex-col items-center justify-center text-center py-4 col-span-2 bg-gradient-to-br from-indigo-500 to-purple-600 text-white border-b-4 border-indigo-800">
                     <p className="font-bold text-lg">Codzienny trening to klucz do gwiazd! 🚀</p>
                   </Card>
                </div>

                <h2 className="text-2xl font-bold text-gray-800 mb-6 pl-2 border-l-4 border-indigo-500 ml-1">Wybierz misję:</h2>
                
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  {/* Przyciski gier (bez zmian) */}
                  <button onClick={() => onStartGame('add')} className="bg-white group hover:bg-green-50 p-6 rounded-3xl shadow-lg hover:shadow-xl border-b-4 border-green-200 hover:border-green-400 transition-all flex items-center gap-6">
                     <div className="bg-green-100 text-green-600 p-4 rounded-2xl group-hover:scale-110 transition-transform shadow-sm">
                        <Icon name="Plus" size={32} />
                     </div>
                     <div className="text-left">
                       <h3 className="text-xl font-bold text-gray-800">Dodawanie</h3>
                       <p className="text-gray-500 text-sm">Misja: Suma składników</p>
                     </div>
                  </button>

                  <button onClick={() => onStartGame('sub')} className="bg-white group hover:bg-red-50 p-6 rounded-3xl shadow-lg hover:shadow-xl border-b-4 border-red-200 hover:border-red-400 transition-all flex items-center gap-6">
                     <div className="bg-red-100 text-red-600 p-4 rounded-2xl group-hover:scale-110 transition-transform shadow-sm">
                        <span className="text-4xl font-bold leading-none flex items-center justify-center h-8 w-8 pb-2">-</span>
                     </div>
                     <div className="text-left">
                       <h3 className="text-xl font-bold text-gray-800">Odejmowanie</h3>
                       <p className="text-gray-500 text-sm">Misja: Redukcja liczebności</p>
                     </div>
                  </button>

                  <button onClick={() => onStartGame('mul')} className="bg-white group hover:bg-blue-50 p-6 rounded-3xl shadow-lg hover:shadow-xl border-b-4 border-blue-200 hover:border-blue-400 transition-all flex items-center gap-6">
                     <div className="bg-blue-100 text-blue-600 p-4 rounded-2xl group-hover:scale-110 transition-transform shadow-sm">
                        <span className="text-3xl font-bold leading-none flex items-center justify-center h-8 w-8">×</span>
                     </div>
                     <div className="text-left">
                       <h3 className="text-xl font-bold text-gray-800">Mnożenie</h3>
                       <p className="text-gray-500 text-sm">Misja: Szybki wzrost</p>
                     </div>
                  </button>

                  <button onClick={() => onStartGame('div')} className="bg-white group hover:bg-orange-50 p-6 rounded-3xl shadow-lg hover:shadow-xl border-b-4 border-orange-200 hover:border-orange-400 transition-all flex items-center gap-6">
                     <div className="bg-orange-100 text-orange-600 p-4 rounded-2xl group-hover:scale-110 transition-transform shadow-sm">
                        <span className="text-3xl font-bold leading-none flex items-center justify-center h-8 w-8 pb-1">:</span>
                     </div>
                     <div className="text-left">
                       <h3 className="text-xl font-bold text-gray-800">Dzielenie</h3>
                       <p className="text-gray-500 text-sm">Misja: Równy podział</p>
                     </div>
                  </button>
                </div>
              </div>
            </div>
          );
        };

        const GameScreen = ({ question, userAnswer, feedback, gameStats, onAnswerChange, onCheckAnswer, onFinishGame }) => {
          if (!question) return <div className="min-h-screen flex items-center justify-center bg-indigo-50 font-bold text-indigo-500">Ładowanie misji...</div>;

          return (
            <div className="min-h-screen bg-indigo-50 flex flex-col">
              <div className="p-4 flex justify-between items-center max-w-4xl mx-auto w-full">
                 <button onClick={onFinishGame} className="text-gray-500 hover:text-gray-800 font-bold flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-sm transition">
                   <Icon name="ArrowLeft" size={20} /> <span className="hidden sm:inline">Przerwij misję</span>
                 </button>
                 <div className="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-indigo-600 flex items-center gap-2 border border-indigo-100">
                   <Icon name="Check" size={18} className="text-green-500"/> {gameStats.correct}/{gameStats.total}
                 </div>
              </div>

              <div className="flex-1 flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full">
                <Card className={`w-full text-center mb-6 transition-all duration-300 border-b-8 ${feedback === 'correct' ? 'border-green-400 bg-green-50 shadow-green-200' : feedback === 'wrong' ? 'border-red-400 bg-red-50 shadow-red-200' : 'border-indigo-200'}`}>
                  <div className="text-gray-400 font-bold uppercase tracking-widest text-xs mb-4">Rozwiąż równanie</div>
                  <div className="text-6xl sm:text-7xl font-extrabold text-gray-800 mb-8 flex justify-center items-center gap-3 sm:gap-6 flex-wrap">
                    <span>{question.a}</span>
                    <span className="text-indigo-500">{question.operator}</span>
                    <span>{question.b}</span>
                    <span>=</span>
                    <span className={`min-w-[80px] sm:min-w-[100px] inline-block border-b-4 ${userAnswer ? 'text-indigo-800 border-indigo-500' : 'text-gray-300 border-gray-200'}`}>
                      {userAnswer || '?'}
                    </span>
                  </div>

                  <div className="h-8">
                    {feedback === 'correct' && (
                      <div className="text-green-600 font-bold text-xl animate-bounce flex items-center justify-center gap-2"><Icon name="Star" className="fill-current" size={20}/> Świetnie! +10 XP</div>
                    )}
                    {feedback === 'wrong' && (
                      <div className="text-red-500 font-bold text-xl flex items-center justify-center gap-2"><Icon name="X" size={24}/> Spróbuj jeszcze raz!</div>
                    )}
                  </div>
                </Card>

                <div className="grid grid-cols-3 gap-3 w-full max-w-[360px]">
                  {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                    <button
                      key={num}
                      onClick={() => onAnswerChange(num.toString())}
                      className="bg-white h-16 rounded-2xl shadow-[0_4px_0_rgb(0,0,0,0.1)] active:shadow-none active:translate-y-[4px] text-3xl font-bold text-indigo-900 hover:bg-indigo-50 transition-all border border-indigo-100"
                    >
                      {num}
                    </button>
                  ))}
                  <button
                    onClick={() => onAnswerChange('backspace')}
                    className="bg-red-50 h-16 rounded-2xl shadow-[0_4px_0_rgb(0,0,0,0.1)] active:shadow-none active:translate-y-[4px] text-red-500 hover:bg-red-100 flex items-center justify-center border border-red-100 transition-all"
                  >
                    <Icon name="RotateCcw" size={24} />
                  </button>
                  <button
                    onClick={() => onAnswerChange('0')}
                    className="bg-white h-16 rounded-2xl shadow-[0_4px_0_rgb(0,0,0,0.1)] active:shadow-none active:translate-y-[4px] text-3xl font-bold text-indigo-900 hover:bg-indigo-50 transition-all border border-indigo-100"
                  >
                    0
                  </button>
                  <Button
                    variant={feedback === 'wrong' ? 'danger' : 'success'}
                    onClick={onCheckAnswer}
                    className="h-16 text-xl rounded-2xl shadow-[0_4px_0_rgb(0,0,0,0.2)] active:shadow-none active:translate-y-[4px]"
                    disabled={!userAnswer || feedback === 'correct'}
                  >
                    {feedback === 'correct' ? <Icon name="Check" size={32} /> : 'SPRAWDŹ'}
                  </Button>
                </div>
              </div>
            </div>
          );
        };

        const SummaryScreen = ({ gameStats, dailyXp, isDailyGoalMet, onReturn }) => {
          return (
            <div className="min-h-screen bg-indigo-900 flex items-center justify-center p-4">
              <Card className="w-full max-w-md text-center relative overflow-hidden">
                 <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-yellow-400 via-orange-500 to-pink-500"></div>
                 
                 <div className="mb-8 mt-4">
                   <div className="inline-block p-5 bg-yellow-100 rounded-full text-yellow-600 mb-4 shadow-inner">
                     <Icon name="Trophy" size={56} className="animate-pulse" />
                   </div>
                   <h2 className="text-3xl font-bold text-gray-800">Misja Zakończona!</h2>
                 </div>

                 <div className="space-y-4 mb-8">
                   <div className="bg-indigo-50 p-5 rounded-2xl flex justify-between items-center border border-indigo-100">
                     <div className="flex items-center gap-3">
                       <Icon name="Zap" className="text-yellow-500" size={24} />
                       <span className="text-gray-700 font-bold">Zdobyte XP</span>
                     </div>
                     <span className="text-3xl font-black text-indigo-600">+{gameStats.xpGained}</span>
                   </div>
                   
                   {/* Podsumowanie Celu Dziennego */}
                   <div className={`p-5 rounded-2xl border-2 ${isDailyGoalMet ? 'bg-green-50 border-green-200' : 'bg-blue-50 border-blue-200'}`}>
                     <div className="flex justify-between items-center mb-2">
                        <span className="font-bold text-gray-700">Cel Dnia</span>
                        <span className="font-bold">{dailyXp} / {DAILY_XP_GOAL} XP</span>
                     </div>
                     <div className="w-full bg-white rounded-full h-3 overflow-hidden border border-gray-200">
                        <div 
                          className={`h-full ${isDailyGoalMet ? 'bg-green-500' : 'bg-blue-500'}`} 
                          style={{ width: `${Math.min(100, (dailyXp / DAILY_XP_GOAL) * 100)}%` }}
                        ></div>
                     </div>
                     {isDailyGoalMet ? (
                        <p className="text-green-600 font-bold text-sm mt-2 flex items-center justify-center gap-1">
                           <Icon name="Check" size={16}/> Cel osiągnięty! Streak +1
                        </p>
                     ) : (
                        <p className="text-blue-600 text-sm mt-2">
                           Brakuje jeszcze {DAILY_XP_GOAL - dailyXp} XP
                        </p>
                     )}
                   </div>

                   <div className="bg-gray-50 p-5 rounded-2xl flex justify-between items-center border border-gray-200">
                     <div className="flex items-center gap-3">
                       <Icon name="Check" className="text-green-500" size={24} />
                       <span className="text-gray-700 font-bold">Poprawne</span>
                     </div>
                     <span className="text-3xl font-black text-green-600">{gameStats.correct} <span className="text-lg text-gray-400 font-normal">/ {gameStats.total}</span></span>
                   </div>
                 </div>

                 <Button onClick={onReturn} className="w-full py-4 text-xl">
                   Wróć do Bazy
                 </Button>
              </Card>
            </div>
          );
        };

        // --- GŁÓWNY KOMPONENT ---

        function MathGalaxy() {
          const [users, setUsers] = React.useState(() => {
            try {
              const saved = localStorage.getItem('mathGalaxyUsers');
              return saved ? JSON.parse(saved) : [];
            } catch (e) {
              console.error("Błąd odczytu localStorage:", e);
              return [];
            }
          });
          
          const [view, setView] = React.useState('profiles');
          const [currentUser, setCurrentUser] = React.useState(null);
          
          const [gameMode, setGameMode] = React.useState(null);
          const [question, setQuestion] = React.useState(null);
          const [userAnswer, setUserAnswer] = React.useState('');
          const [feedback, setFeedback] = React.useState(null);
          const [gameStats, setGameStats] = React.useState({ correct: 0, total: 0, xpGained: 0 });

          // Persystencja
          React.useEffect(() => {
            try {
              localStorage.setItem('mathGalaxyUsers', JSON.stringify(users));
            } catch (e) {
              console.error("Błąd zapisu localStorage:", e);
            }
          }, [users]);

          // Logika
          const handleCreateUser = (name, avatar) => {
            const newUser = {
              id: Date.now(),
              name,
              avatar,
              xp: 0,
              streak: 0,
              lastPlayed: null,
              dailyXp: 0,
              dailyGoalReached: false,
              history: []
            };
            const updatedUsers = [...users, newUser];
            setUsers(updatedUsers);
            loginUser(newUser, updatedUsers);
          };

          const handleDeleteUser = (e, userId) => {
            e.stopPropagation();
            // Używamy window.confirm tylko jako tymczasowego zastępstwa, w prawdziwej aplikacji byłby to modal UI.
            if (window.confirm("Czy na pewno usunąć ten profil?")) {
              const updatedUsers = users.filter(u => u.id !== userId);
              setUsers(updatedUsers);
              if (currentUser?.id === userId) {
                setCurrentUser(null);
              }
            }
          };

          const loginUser = (user, currentUsersList = users) => {
            const today = new Date().toDateString();
            let updatedUser = { ...user };

            if (user.lastPlayed !== today) {
               // Jeśli nowy dzień, resetujemy dzienny postęp i status celu.
               updatedUser.dailyXp = 0;
               updatedUser.dailyGoalReached = false;
               
               const yesterday = new Date();
               yesterday.setDate(yesterday.getDate() - 1);
               
               // Resetujemy streak, jeśli przerwa jest dłuższa niż jeden dzień.
               if (user.lastPlayed && user.lastPlayed !== yesterday.toDateString()) {
                  updatedUser.streak = 0; 
               }
            } else {
                // Jeśli ten sam dzień, zachowujemy dzienny XP i status celu.
                updatedUser.dailyXp = user.dailyXp || 0;
                updatedUser.dailyGoalReached = user.dailyGoalReached || false;
            }

            const updatedList = currentUsersList.map(u => u.id === user.id ? updatedUser : u);
            setUsers(updatedList);
            setCurrentUser(updatedUser);
            setView('dashboard');
          };

          const updateUserProgress = (xpGained) => {
            if (!currentUser) return;

            const today = new Date().toDateString();
            let updatedUser = { ...currentUser };
            
            updatedUser.xp += xpGained;
            
            const currentDailyXp = updatedUser.dailyXp || 0;
            const newDailyXp = currentDailyXp + xpGained;
            updatedUser.dailyXp = newDailyXp;
            updatedUser.lastPlayed = today;

            // Logika Streak: zwiększamy streak tylko raz dziennie, gdy osiągnięto cel 200 XP
            if (newDailyXp >= DAILY_XP_GOAL && !updatedUser.dailyGoalReached) {
               // Jeśli ostatni zarejestrowany dzień to wczoraj, to streak +1. 
               // Jeśli to pierwszy raz dzisiaj osiągnął cel, a ostatni raz grał starszy niż wczoraj, streak jest resetowany do 1 (został wyzerowany przy logowaniu).
               // Jeśli ostatni raz grał wczoraj, streak już jest poprawny.
               
               const yesterday = new Date();
               yesterday.setDate(yesterday.getDate() - 1);

               // Sprawdzamy, czy wczoraj miał już zaliczony cel, by nie dodawać podwójnie.
               // Ponieważ przy logowaniu z nowego dnia, streak jest resetowany TYLKO jeśli była duża przerwa, 
               // a w innym przypadku zostaje 0, 
               // wystarczy, że dodamy 1, gdy osiągnął cel i nie miał go jeszcze zaliczonego dzisiaj.
               updatedUser.streak += 1;
               updatedUser.dailyGoalReached = true;
            }

            setCurrentUser(updatedUser);
            setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
          };

          // Generowanie pytań
          const generateQuestion = (mode) => {
            let a, b, operator, answer;
            switch (mode) {
              case 'add':
                a = Math.floor(Math.random() * 90) + 10;
                b = Math.floor(Math.random() * 90) + 10;
                operator = '+';
                answer = a + b;
                break;
              case 'sub':
                a = Math.floor(Math.random() * 90) + 10;
                b = Math.floor(Math.random() * a);
                operator = '-';
                answer = a - b;
                break;
              case 'mul':
                a = Math.floor(Math.random() * 9) + 2;
                b = Math.floor(Math.random() * 9) + 2;
                operator = '×';
                answer = a * b;
                break;
              case 'div':
                b = Math.floor(Math.random() * 9) + 2;
                answer = Math.floor(Math.random() * 9) + 2;
                a = b * answer;
                operator = ':';
                break;
              default: return;
            }
            setQuestion({ a, b, operator, answer });
            setUserAnswer('');
            setFeedback(null);
          };

          const startGame = (mode) => {
            setGameMode(mode);
            setGameStats({ correct: 0, total: 0, xpGained: 0 });
            setView('game');
            generateQuestion(mode);
          };

          const handleGameInput = (val) => {
            if (val === 'backspace') {
              setUserAnswer(prev => prev.slice(0, -1));
            } else {
              // Ograniczenie do 4 cyfr
              if (userAnswer.length < 4) {
                 setUserAnswer(prev => prev + val);
              }
            }
          };

          const checkAnswer = () => {
            const val = parseInt(userAnswer);
            if (isNaN(val)) return;

            const isCorrect = val === question.answer;
            const xp = isCorrect ? 10 : 0;

            setFeedback(isCorrect ? 'correct' : 'wrong');
            setGameStats(prev => ({
              correct: prev.correct + (isCorrect ? 1 : 0),
              total: prev.total + 1,
              xpGained: prev.xpGained + xp
            }));

            if (isCorrect) {
              setTimeout(() => {
                generateQuestion(gameMode);
              }, 1000);
            }
          };

          const finishGame = () => {
            updateUserProgress(gameStats.xpGained);
            setView('summary');
          };

          // Routing
          return (
            <div className="font-sans text-slate-800 select-none">
              {view === 'profiles' && (
                <ProfilesScreen 
                  users={users} 
                  currentUser={currentUser}
                  onLogin={loginUser} 
                  onCreate={handleCreateUser} 
                  onDelete={handleDeleteUser}
                  onCancelCreate={() => setView('dashboard')}
                />
              )}
              {view === 'dashboard' && currentUser && (
                <DashboardScreen 
                  currentUser={currentUser} 
                  onChangeProfile={() => setView('profiles')}
                  onStartGame={startGame}
                />
              )}
              {view === 'game' && (
                <GameScreen 
                  question={question}
                  userAnswer={userAnswer}
                  feedback={feedback}
                  gameStats={gameStats}
                  onAnswerChange={handleGameInput}
                  onCheckAnswer={checkAnswer}
                  onFinishGame={finishGame}
                />
              )}
              {view === 'summary' && (
                <SummaryScreen 
                  gameStats={gameStats}
                  dailyXp={currentUser?.dailyXp || 0}
                  isDailyGoalMet={currentUser?.dailyGoalReached}
                  onReturn={() => setView('dashboard')}
                />
              )}
            </div>
          );
        }

        // Renderowanie aplikacji
        const domNode = document.getElementById('root');
        const root = ReactDOM.createRoot(domNode);
        root.render(<MathGalaxy />);
    </script>
</body>
</html>
